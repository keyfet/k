plugins {
    id 'com.android.application'
}
android {
    namespace 'com.minitm.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.minitm.browser'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
